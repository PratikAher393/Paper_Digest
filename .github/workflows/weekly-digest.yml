name: weekly-paper-digest

on:
  schedule:
    - cron: "17 12 * * 1"    # Mondays 12:17 UTC (about 8:17 am Knoxville time); off the busy :00 mark
    - cron: "17 17 * * 1"    # backup run 5 hours later in case GitHub skipped the first one
  workflow_dispatch:          # adds the "Run workflow" button

permissions:
  contents: write             # lets the job commit digest files back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests pyyaml

      - name: Build digest
        run: python digest.py

      - name: Commit and push digest files
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          git commit -m "digest: $(date +%Y-%m-%d)" || echo "nothing to commit"
          git push
