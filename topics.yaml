# ============================================================
#  Paper digest configuration — edit this file, not the code.
# ============================================================

days_back: 7          # size of the search window (one week)
min_score: 2          # papers scoring below this are dropped (lower = more papers)
max_per_topic: 20     # cap so one busy topic doesn't flood the email
contact_email: paher@vols.utk.edu

# arXiv categories to scan (cross-listed papers are de-duplicated)
arxiv_categories:
  - cond-mat.supr-con      # superconductivity
  - cond-mat.mes-hall      # mesoscopic physics, Majorana
  - cond-mat.mtrl-sci      # materials science

# Journals pulled from Crossref, by ISSN
journals:
  Physical Review Letters: 0031-9007
  Physical Review B: 2469-9950
  Physical Review Applied: 2331-7019
  Physical Review Materials: 2475-9953
  Nature Physics: 1745-2473
  Nature Communications: 2041-1723
  Nature Materials: 1476-1122
  Nano Letters: 1530-6984
  ACS Nano: 1936-086X

# Topics -> {keyword: weight}. Matching is case-insensitive substring.
# A keyword found in the TITLE counts double.
# Add or remove topics based on what you care about.
topics:
  
  Superconducting Diode Effect:
    superconducting diode: 5
    josephson diode: 5
    nonreciprocal superconduct: 4
    diode effect: 3
    magnetochiral: 2
    asymmetric josephson: 3

  Majorana / SC-Semiconductor Hybrids:
    majorana: 4
    topological superconduct: 3
    inas: 2
    ingaas: 2
    planar josephson: 3
    selective area growth: 3
    sag growth: 3
    shadow: 1
    proximit: 2
    andreev: 2

  β-Sn and MBE Superconductors:
    β-sn: 5
    beta-sn: 5
    tin film: 3
    sn epitaxy: 3
    molecular beam epitaxy: 1
    mbe superconduct: 2
    

  NbSe2 / Intercalated TMDs:
    nbse: 3
    intercalat: 2
    ising superconduct: 3
    transition metal: 2
    tmd: 2

  

  Quantum Materials & Transport:
    quantum oscillation: 2
    hall effect: 2
    magnetotransport: 2
    two-dimensional electron: 2
    topological: 2

