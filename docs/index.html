<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Literata:opsz,wght@7..72,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F6F8;
    --surface: #FFFFFF;
    --ink: #17212B;
    --ink2: #44525F;
    --ink3: #5E6B78;
    --rule: #D9E0E6;
    --link: #1757B8;
    --mark: #FFE27A;
    --mark-ink: #17212B;
    --serif: 'Literata', Georgia, 'Times New Roman', serif;
    --sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #11161B;
      --surface: #182027;
      --ink: #E8EDF1;
      --ink2: #B4C0CA;
      --ink3: #93A0AC;
      --rule: #2A333C;
      --link: #86B6FF;
      --mark: #6A5600;
      --mark-ink: #FFF1B8;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  button { font: inherit; color: inherit; }
  mark { background: var(--mark); color: var(--mark-ink); padding: 0 .12em; border-radius: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- layout ---------- */
  .shell {
    display: grid;
    grid-template-columns: 272px minmax(0, 1fr);
    gap: 56px;
    max-width: 1120px;
    margin: 0 auto;
    padding: 36px 24px 96px;
  }
  .rail { position: sticky; top: 28px; align-self: start; max-height: calc(100vh - 56px); overflow-y: auto; padding-right: 4px; }
  .main { min-width: 0; }

  /* ---------- rail ---------- */
  .brand { font: 600 22px/1.2 var(--serif); letter-spacing: -0.01em; margin: 0; }
  .blurb { color: var(--ink2); font-size: 13.5px; margin: 4px 0 26px; }
  .field { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 6px; }
  .rail select, .rail input[type=search] {
    width: 100%; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; margin-bottom: 18px;
  }
  .rail-h { font: 600 13px/1.3 var(--sans); color: var(--ink2); margin: 24px 0 6px; }
  .facets { list-style: none; margin: 0; padding: 0; }
  .facet {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px);
    color: var(--ink2); cursor: pointer;
  }
  .facet:hover { background: var(--surface); }
  .facet[aria-pressed=true] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
  .facet .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink3); font-weight: 400; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink3)); flex: none; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 20px; color: var(--ink2); cursor: pointer; }
  .foot { color: var(--ink3); font-size: 12.5px; margin-top: 28px; }

  /* ---------- header + day strip ---------- */
  .week { font: 500 clamp(30px, 4.4vw, 42px)/1.1 var(--serif); letter-spacing: -0.015em; margin: 0 0 8px; }
  .summary { color: var(--ink2); margin: 0 0 28px; }
  .cap { color: var(--ink3); font-size: 12.5px; margin: 0 0 8px; }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .day { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
  .day:disabled { cursor: default; }
  .dots {
    display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center;
    gap: 3px; height: 92px; padding-bottom: 7px; overflow: hidden; border-bottom: 1px solid var(--ink);
  }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .lbl { text-align: center; padding-top: 7px; font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .lbl b { display: inline-block; min-width: 1.9em; font: 500 17px/1.3 var(--serif); color: var(--ink); border-radius: 3px; }
  .lbl span { display: block; }
  .day[aria-pressed=true] .lbl b { background: var(--mark); color: var(--mark-ink); }
  .day:not(:disabled):hover .lbl b { text-decoration: underline; }
  .strip.has-day .day:not([aria-pressed=true]) .dots { opacity: .3; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; margin: 26px 0 0; font-size: 13px; color: var(--ink2); }
  .toolbar > div { display: flex; align-items: center; gap: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg label { cursor: pointer; }
  .seg span { display: block; padding: 5px 12px; color: var(--ink2); }
  .seg input:checked + span { background: var(--ink); color: var(--paper); }
  .seg input:focus-visible + span { outline: 2px solid var(--link); outline-offset: -2px; }

  /* ---------- groups + papers ---------- */
  .group { margin-top: 38px; }
  .group-h { display: flex; align-items: center; gap: 10px; margin: 0 0 2px; font: 600 20px/1.3 var(--serif); letter-spacing: -0.005em; }
  .group-h .n { font: 400 13px var(--sans); color: var(--ink3); }
  .note { color: var(--ink2); font-size: 13.5px; margin: 0 0 4px; }

  .paper { display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 18px; padding: 18px 0; border-top: 1px solid var(--rule); }
  .group-h + .paper, .note + .paper { margin-top: 10px; }
  .pub { line-height: 1.1; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .pub b { display: block; font: 500 24px/1.05 var(--serif); }
  .pub span { font-size: 12.5px; color: var(--ink3); }
  .paper.feat .pub b { color: var(--link); }
  .title { font: 500 17.5px/1.38 var(--serif); letter-spacing: -0.003em; margin: 0 0 5px; max-width: 70ch; }
  .title a { color: var(--ink); text-decoration: none; }
  .title a:hover { color: var(--link); text-decoration: underline; }
  .authors { font-size: 13.5px; color: var(--ink2); margin: 0 0 8px; max-width: 78ch; }
  .authors .w { color: var(--ink); font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12.5px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink2); }
  .chip.arxiv { border-color: var(--ink3); }
  .chip.journal { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.flag { border-color: var(--link); color: var(--link); font-weight: 600; }
  .kws { color: var(--ink3); }
  .abs { margin-top: 8px; }
  .abs summary { cursor: pointer; color: var(--link); font-size: 13px; list-style: none; width: max-content; }
  .abs summary::-webkit-details-marker { display: none; }
  .abs[open] summary { color: var(--ink2); }
  .abs p { font: 400 15px/1.62 var(--serif); color: var(--ink2); margin: 8px 0 0; max-width: 68ch; }

  .empty { padding: 56px 0; color: var(--ink2); max-width: 52ch; }
  .empty h2 { font: 500 22px/1.3 var(--serif); color: var(--ink); margin: 0 0 8px; }
  .btn { background: var(--ink); color: var(--paper); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; margin-top: 8px; }

  /* ---------- small screens ---------- */
  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; gap: 28px; padding: 22px 16px 72px; }
    .rail { position: static; max-height: none; overflow: visible; min-width: 0; }
    .shell { overflow-x: clip; }
    .facets { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .facet { width: auto; margin: 0; flex: none; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; }
    .facet[aria-pressed=true] { box-shadow: none; background: var(--ink); color: var(--paper); }
    .facet[aria-pressed=true] .n { color: var(--paper); }
    .paper { grid-template-columns: 42px minmax(0, 1fr); column-gap: 14px; }
    .dots { height: 76px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="shell">

  <aside class="rail" aria-label="Filters">
    <h1 class="brand">Weekly papers</h1>
    <p class="blurb">New arXiv and journal papers that match your topics, every Monday.</p>

    <label class="field" for="week">Week</label>
    <select id="week"></select>

    <label class="field" for="q">Search</label>
    <input id="q" type="search" placeholder="Title, author, or abstract" autocomplete="off">

    <h2 class="rail-h">Topics</h2>
    <ul class="facets" id="topics"></ul>

    <h2 class="rail-h">Source</h2>
    <ul class="facets" id="sources"></ul>

    <label class="check"><input type="checkbox" id="watched"> Watched authors only</label>
    <p class="foot">Data from arXiv and Crossref. Edit topics.yaml in the repo to change what matches.</p>
  </aside>

  <main class="main" id="main" aria-live="polite">
    <p class="empty">Loading papers…</p>
  </main>

</div>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Colour-blind-safe set; one colour per topic, in the order topics appear in topics.yaml
const PALETTE = ['#0072B2','#D55E00','#009E73','#CC79A7','#E69F00','#56B4E9','#7A6FB5','#6B7785'];

const state = {
  index: [],          // [{date, count}] from digests.json
  cache: {},          // date -> normalized digest
  week: '',           // a digest date, or 'all'
  q: '', topic: '', source: '', day: '', watched: false,
  group: 'topic', sort: 'score',
};
let items = [];       // papers of the week being shown
let topicOrder = [];  // topic names, for stable colours and ordering

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

/* ---------- dates (kept as plain ISO strings to avoid time-zone surprises) ---------- */
function parseISO(s) {
  const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(s || '');
  return m ? { y: +m[1], m: +m[2], d: m[3] ? +m[3] : 0 } : null;
}
const addDays = (iso, n) => { const t = new Date(iso + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const weekday = iso => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
function dayRange(a, b) { const out = []; for (let d = a; d <= b && out.length < 40; d = addDays(d, 1)) out.push(d); return out; }
function longDate(iso) { const p = parseISO(iso); return p ? `${MONTHS[p.m-1]} ${p.d}, ${p.y}` : iso; }
function periodLabel(period) {
  const [a, b] = (period || '').split(' to ').map(parseISO);
  if (!a || !b) return '';
  const left = `${MONTHS[a.m-1]} ${a.d}`;
  const right = a.m === b.m ? `${b.d}` : `${MONTHS[b.m-1]} ${b.d}`;
  return `${left} – ${right}, ${b.y}`;
}

/* ---------- loading ---------- */
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${url} returned HTTP ${r.status}`);
  return r.json();
}

// Accepts the current format and the older one (no dates, source = "arXiv · category")
function normalize(d) {
  const papers = [];
  for (const [topic, list] of Object.entries(d.topics || {})) {
    for (const p of list) {
      const kind = p.kind || (/^arxiv/i.test(p.source || '') ? 'arxiv' : 'journal');
      const category = p.category || (kind === 'arxiv' ? (p.source || '').split('·')[1]?.trim() || '' : '');
      const source = kind === 'arxiv' ? 'arXiv' : (p.source || 'Journal');
      papers.push({
        title: p.title || '(untitled)', authors: p.authors || '', abstract: p.abstract || '',
        url: p.url, kind, category, source,
        topic: p.topic || topic, score: p.score || 0, published: p.published || '',
        matched: p.matched || [], watched: p.watched || [], featured: !!p.featured,
        hay: plain(`${p.title} ${p.authors} ${p.abstract}`),
      });
    }
  }
  return { date: d.date, period: d.period, topicOrder: d.topic_order || [], papers };
}

async function loadWeek(date) {
  if (!state.cache[date]) state.cache[date] = normalize(await getJSON(`digests/${date}.json`));
  return state.cache[date];
}

async function loadAll() {
  const results = await Promise.allSettled(state.index.map(e => loadWeek(e.date)));
  return results.filter(r => r.status === 'fulfilled').map(r => r.value);
}

async function setWeek(week) {
  state.week = week;
  state.day = '';
  const digests = week === 'all' ? await loadAll() : [await loadWeek(week)];
  items = digests.flatMap(d => d.papers);
  topicOrder = (digests.find(d => d.topicOrder.length) || {}).topicOrder || [...new Set(items.map(p => p.topic))].sort();
}

/* ---------- filtering ---------- */
function queryTokens() { return plain(state.q).split(/\s+/).filter(Boolean); }

// `skip` lets the filter lists count "what would I get if I changed this filter"
function matches(p, skip = []) {
  if (!skip.includes('topic') && state.topic && p.topic !== state.topic) return false;
  if (!skip.includes('source') && state.source && p.source !== state.source) return false;
  if (!skip.includes('day') && state.day && p.published !== state.day) return false;
  if (state.watched && !p.watched.length) return false;
  return queryTokens().every(t => p.hay.includes(t));
}

const colorOf = topic => PALETTE[Math.max(0, topicOrder.indexOf(topic)) % PALETTE.length];
const bySort = mode => (a, b) => mode === 'newest'
  ? b.published.localeCompare(a.published) || b.score - a.score
  : b.score - a.score || b.published.localeCompare(a.published);

/* ---------- text helpers ---------- */
function highlight(text, words) {
  text = String(text || '');
  const ws = [...new Set(words.filter(w => w && w.length > 1))].sort((a, b) => b.length - a.length);
  if (!ws.length) return esc(text);
  try {
    const re = new RegExp('(?<![A-Za-z0-9])(?:' + ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    let out = '', last = 0, m;
    while ((m = re.exec(text))) {
      if (!m[0]) { re.lastIndex++; continue; }
      out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  } catch { return esc(text); }
}

function authorsHTML(p) {
  const names = p.authors.split(/,\s*/).filter(Boolean);
  if (!names.length) return '';
  const isWatched = n => p.watched.some(w => plain(n).includes(plain(w)));
  const shown = names.filter((n, i) => i < 5 || isWatched(n));     // always show watched authors
  const html = shown.map(n => isWatched(n) ? `<span class="w">${esc(n)}</span>` : esc(n)).join(', ');
  const more = names.length - shown.length;
  return html + (more > 0 ? ` and ${more} more` : '');
}

function dateCell(p) {
  const d = parseISO(p.published);
  if (!d) return '<span>No date</span>';
  const year = state.week === 'all' ? ` ${d.y}` : '';
  return d.d ? `<b>${d.d}</b><span>${MONTHS[d.m-1]}${year}</span>` : `<b>${MONTHS[d.m-1]}</b><span>${d.y}</span>`;
}

function paperHTML(p, { open = false, showTopic = true, inPicks = false } = {}) {
  const words = [...p.matched, ...queryTokens()];
  const flag = !inPicks && p.featured ? `<span class="chip flag">${p.watched.length ? 'Watched author' : 'Top pick'}</span>` : '';
  const src = p.kind === 'arxiv'
    ? `<span class="chip arxiv">arXiv${p.category ? ' ' + esc(p.category) : ''}</span>`
    : `<span class="chip journal">${esc(p.source)}</span>`;
  const topic = showTopic ? `<span class="chip"><span class="dot" style="--c:${colorOf(p.topic)}"></span>${esc(p.topic)}</span>` : '';
  const kws = p.matched.length ? `<span class="kws" title="Matched keywords">${p.matched.slice(0, 6).map(k => `<mark>${esc(k)}</mark>`).join(' ')}</span>` : '';
  const abs = p.abstract
    ? `<details class="abs"${open ? ' open' : ''}><summary>Abstract</summary><p>${highlight(p.abstract, words)}</p></details>` : '';
  return `<article class="paper${p.featured ? ' feat' : ''}">
    <div class="pub">${dateCell(p)}</div>
    <div>
      <h3 class="title"><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer">${highlight(p.title, words)}</a></h3>
      <p class="authors">${authorsHTML(p)}</p>
      <div class="meta">${flag}${src}${topic}${kws}</div>
      ${abs}
    </div>
  </article>`;
}

/* ---------- grouping ---------- */
function groupItems(list) {
  const buckets = new Map();
  const add = (key, label, color, p) => {
    if (!buckets.has(key)) buckets.set(key, { key, label, color, items: [] });
    buckets.get(key).items.push(p);
  };
  for (const p of list) {
    if (state.group === 'date') {
      const d = parseISO(p.published);
      const label = !d ? 'Date not available' : d.d ? `${weekday(p.published)}, ${MONTHS[d.m-1]} ${d.d}` : `${MONTHS[d.m-1]} ${d.y}`;
      add(p.published || '0', label, null, p);
    } else if (state.group === 'source') {
      add(p.source, p.source, null, p);
    } else {
      add(p.topic, p.topic, colorOf(p.topic), p);
    }
  }
  const groups = [...buckets.values()];
  if (state.group === 'date') groups.sort((a, b) => b.key.localeCompare(a.key));
  else if (state.group === 'source') groups.sort((a, b) => (a.key === 'arXiv' ? -1 : b.key === 'arXiv' ? 1 : a.key.localeCompare(b.key)));
  else groups.sort((a, b) => topicOrder.indexOf(a.key) - topicOrder.indexOf(b.key));
  return groups;
}

/* ---------- rendering ---------- */
function facetHTML(act, value, label, n, pressed, color) {
  const dot = color ? `<span class="dot" style="--c:${color}"></span>` : '';
  return `<li><button class="facet" data-act="${act}" data-v="${esc(value)}" aria-pressed="${pressed}">${dot}${esc(label)}<span class="n">${n}</span></button></li>`;
}

function renderRail() {
  const count = (key, skip) => items.filter(p => matches(p, [skip])).reduce((m, p) => (m[p[key]] = (m[p[key]] || 0) + 1, m), {});
  const byTopic = count('topic', 'topic');
  const topics = [...new Set([...topicOrder, ...Object.keys(byTopic)])].filter(t => byTopic[t] || t === state.topic);
  const total = Object.values(byTopic).reduce((a, b) => a + b, 0);
  $('topics').innerHTML = facetHTML('topic', '', 'All topics', total, !state.topic)
    + topics.map(t => facetHTML('topic', t, t, byTopic[t] || 0, state.topic === t, colorOf(t))).join('');

  const bySource = count('source', 'source');
  const sources = Object.keys(bySource).sort((a, b) => (a === 'arXiv' ? -1 : b === 'arXiv' ? 1 : a.localeCompare(b)));
  const totalS = Object.values(bySource).reduce((a, b) => a + b, 0);
  $('sources').innerHTML = facetHTML('source', '', 'All sources', totalS, !state.source)
    + sources.map(s => facetHTML('source', s, s, bySource[s], state.source === s)).join('');
}

function stripHTML(digestPeriod) {
  const [a, b] = (digestPeriod || '').split(' to ');
  const dated = items.map(p => p.published).filter(d => d.length === 10).sort();
  const start = a || dated[0], end = b || dated[dated.length - 1];
  if (!start || !end) return '';
  const pool = items.filter(p => matches(p, ['day']));
  const rank = t => Math.max(0, topicOrder.indexOf(t));
  const cols = dayRange(start, end).map(d => {
    const list = pool.filter(p => p.published === d).sort((x, y) => rank(x.topic) - rank(y.topic));
    const dots = list.map(p => `<i style="--c:${colorOf(p.topic)}"></i>`).join('');
    const label = `${weekday(d)} ${longDate(d)}: ${plural(list.length, 'paper')}`;
    return `<button class="day" data-act="day" data-v="${d}" aria-pressed="${state.day === d}" aria-label="${esc(label)}"${list.length ? '' : ' disabled'}>
      <span class="dots" aria-hidden="true">${dots}</span>
      <span class="lbl"><b>${+d.slice(8)}</b><span>${weekday(d)}</span></span></button>`;
  }).join('');
  return `<p class="cap">Papers by publication date. Select a day to filter.</p>
    <div class="strip${state.day ? ' has-day' : ''}" role="group" aria-label="Papers per publication day">${cols}</div>`;
}

function renderMain() {
  const main = $('main');
  const digest = state.week !== 'all' ? state.cache[state.week] : null;
  const list = items.filter(p => matches(p));
  const filtered = state.q || state.topic || state.source || state.day || state.watched;

  const title = digest ? (periodLabel(digest.period) || `Week ending ${longDate(digest.date)}`) : 'All weeks';
  const nTopics = new Set(items.map(p => p.topic)).size;
  const summary = filtered
    ? `${list.length} of ${plural(items.length, 'paper')} match your filters.`
    : `${plural(items.length, 'paper')} in ${plural(nTopics, 'topic')}, ${items.filter(p => p.featured).length} marked as top picks.`;

  let html = `<h2 class="week">${esc(title)}</h2><p class="summary">${summary}</p>`;
  if (digest) html += stripHTML(digest.period);

  html += `<div class="toolbar">
    <div><span>Group by</span><div class="seg" role="radiogroup" aria-label="Group by">
      ${[['topic','Topic'],['date','Date'],['source','Source']].map(([v, l]) => `<label><input class="sr" type="radio" name="group" value="${v}"${state.group === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}
    </div></div>
    <div><span>Sort by</span><div class="seg" role="radiogroup" aria-label="Sort by">
      ${[['score','Relevance'],['newest','Newest']].map(([v, l]) => `<label><input class="sr" type="radio" name="sort" value="${v}"${state.sort === v ? ' checked' : ''}><span>${l}</span></label>`).join('')}
    </div></div>
  </div>`;

  if (!list.length) {
    html += `<div class="empty"><h2>No papers match these filters</h2><p>Try a different day or topic, or clear the filters.</p><button class="btn" data-act="clear">Clear filters</button></div>`;
    main.innerHTML = html;
    return;
  }

  // Top picks only on the unfiltered view, so a search never hides its own results
  const picks = filtered ? [] : list.filter(p => p.featured).sort(bySort('score')).slice(0, 6);
  const rest = list.filter(p => !picks.includes(p)).sort(bySort(state.sort));

  if (picks.length) {
    html += `<section class="group"><h3 class="group-h">Top picks</h3>
      <p class="note">Papers by watched authors and the strongest keyword matches.</p>
      ${picks.map(p => paperHTML(p, { open: true, inPicks: true })).join('')}</section>`;
  }
  for (const g of groupItems(rest)) {
    const dot = g.color ? `<span class="dot" style="--c:${g.color}"></span>` : '';
    html += `<section class="group"><h3 class="group-h">${dot}${esc(g.label)}<span class="n">${g.items.length}</span></h3>
      ${g.items.map(p => paperHTML(p, { showTopic: state.group !== 'topic' })).join('')}</section>`;
  }
  main.innerHTML = html;
}

function render() { renderRail(); renderMain(); }

function renderMessage(heading, body) {
  $('main').innerHTML = `<div class="empty"><h2>${esc(heading)}</h2><p>${body}</p></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, v } = el.dataset;
  if (act === 'clear') Object.assign(state, { q: '', topic: '', source: '', day: '', watched: false }), $('q').value = '', $('watched').checked = false;
  else if (act === 'day') state.day = state.day === v ? '' : v;
  else state[act] = v;
  render();
});

document.addEventListener('change', e => {
  if (e.target.name === 'group') state.group = e.target.value;
  else if (e.target.name === 'sort') state.sort = e.target.value;
  else return;
  renderMain();
});

$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('watched').addEventListener('change', e => { state.watched = e.target.checked; render(); });
$('week').addEventListener('change', async e => {
  try { await setWeek(e.target.value); render(); }
  catch (err) { renderMessage('Could not load this week', `The file for this week is missing from the repository (${esc(err.message)}).`); }
});

/* ---------- start ---------- */
(async function init() {
  try { state.index = await getJSON('digests.json'); }
  catch (err) { return renderMessage('Could not load the digest list', `Check that docs/digests.json exists in the repository. (${esc(err.message)})`); }

  state.index.sort((a, b) => b.date.localeCompare(a.date));
  if (!state.index.length) {
    return renderMessage('No digests yet', 'The first digest appears after the next Monday run. To get one now, open the Actions tab in the repository and run the workflow.');
  }

  // Show the newest digest whose file actually exists
  let latest = null;
  for (const e of state.index) {
    try { await setWeek(e.date); latest = e.date; break; } catch { /* try the next one */ }
  }
  if (!latest) return renderMessage('Could not load any digest', 'The files listed in digests.json are missing from docs/digests/.');

  $('week').innerHTML = state.index.map(e => `<option value="${esc(e.date)}">Week ending ${esc(longDate(e.date))}</option>`).join('')
    + (state.index.length > 1 ? '<option value="all">All weeks</option>' : '');
  $('week').value = latest;
  render();
})();
</script>
</body>
</html>
